[project]
name = "ai-radar"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=1.2.0",
    "dbt-core>=1.12.3",
    "dbt-duckdb>=1.11.0",
    "dlt[duckdb]>=1.30.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
