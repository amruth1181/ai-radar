name: ai_radar
version: 0.1.0
config-version: 2

profile: ai_radar

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ai_radar:
    staging:
      +materialized: view
    intermediate:
      +materialized: incremental
    marts:
      +materialized: table

# Digest shape. These are the dials to turn during calibration -- no SQL edit needed:
#   dbt build --vars '{digest_max_per_source: 2}'
vars:
  # Minimum LLM relevance score to be eligible at all.
  digest_min_score: 5
  # Hard ceiling on items delivered. Sized to one Discord message.
  digest_size: 10
  # Diversity caps, applied in that order before the top-N cut. Without them a single
  # busy source or category takes the whole digest -- a real run produced 9 of 12
  # items about one model release, all from one subreddit.
  digest_max_per_source: 3
  # Normalised subject: 'Qwen3.8-Flash-Next' and 'Qwen' are one topic.
  digest_max_per_topic: 2
  digest_max_per_category: 4
  # Looser ceiling for tier-1 backfill, used only when the tight caps leave the
  # digest short of digest_size.
  backfill_max_per_topic: 2
