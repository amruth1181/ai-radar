version: 2

sources:
  - name: raw
    description: >
      Append-only landing zone. dlt owns `items`; the enrichment step owns
      `enrichments`. Nothing here is ever cleaned in place.
    # DuckDB uses a `raw` schema in one file; BigQuery uses a separate dataset.
    schema: "{{ 'raw' if target.type == 'duckdb' else 'ai_radar_raw' }}"
    tables:
      - name: items
        description: One row per item per source sighting. Duplicates are expected here.
      - name: enrichments
        description: LLM triage output, keyed on url_hash. Written by enrich/run.py.
      - name: sent_items
        description: >
          Delivery ledger. Without it the 26-hour window resends yesterday's top
          item, which is the fastest way to stop trusting the digest.
